name: Project Cascade — Propagar estado del padre a sus sub-issues

# Se dispara cuando alguien mueve a mano la tarjeta del issue padre de la release
# en el tablero de GitHub Projects. GitHub Actions no tiene un evento nativo para
# cambios de campo en Projects v2 (son a nivel de organización, no de repo), así
# que el disparo real viene de un relay externo:
#
#   arrastrar la tarjeta → webhook de organización (projects_v2_item) →
#   AWS Lambda (infra/github-webhook-relay) → repository_dispatch (este workflow)
#
# Ver docs/ci-cd.md sección 6 para el flujo completo y los pasos de configuración
# manual (webhook de organización, PAT de dispatch, secret HMAC).
#
# IMPORTANTE: los workflows disparados por repository_dispatch solo corren desde
# la rama por defecto — este workflow no reacciona a nada hasta que esté mergeado
# en main.

on:
  repository_dispatch:
    types: [project-status-changed]

permissions:
  contents: read

jobs:
  cascade:
    name: Propagar estado a los sub-issues del padre
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Propagar estado del issue padre a sus sub-issues
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          MODE: cascade
          CONTENT_NODE_ID: ${{ github.event.client_payload.content_node_id }}
        run: python3 .github/scripts/update_project_status.py
