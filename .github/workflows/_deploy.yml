name: _Deploy — Construir, publicar y desplegar (reutilizable)

# Workflow reutilizable: encapsula los pasos comunes a los tres pipelines de
# despliegue (Desarrollo, QA, Producción) para no triplicar la lógica de
# build + deploy + health check + rollback. No se dispara directamente;
# lo invocan cd-dev.yml, cd-qa.yml y cd-prod.yml vía `workflow_call`.

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment a usar (development | qa | production)"
        required: true
        type: string
      runner_label:
        description: "Etiqueta adicional del runner self-hosted (dev | qa | prod)"
        required: true
        type: string
      version:
        description: "Versión efectiva a fijar en el pom antes de construir (ej. 1.4.0-rc.3)"
        required: true
        type: string
      spring_profile:
        description: "Perfil de Spring a activar en el servicio desplegado (dev | qa | prod)"
        required: true
        type: string
      publish_package:
        description: "Si es true, publica el JAR en GitHub Packages"
        required: false
        type: boolean
        default: false
      create_release:
        description: "Si es true, crea una GitHub Release con el JAR adjunto (solo producción)"
        required: false
        type: boolean
        default: false
      project_status_on_start:
        description: "Estado destino del issue padre al arrancar el despliegue (vacío = no hacer nada)"
        required: false
        type: string
        default: ''
      project_status_from_on_start:
        description: "Estado origen esperado del issue padre al arrancar el despliegue"
        required: false
        type: string
        default: ''
      project_status_on_success:
        description: "Estado destino del issue padre cuando el despliegue termina exitosamente (vacío = no hacer nada)"
        required: false
        type: string
        default: ''
      project_status_from_on_success:
        description: "Estado origen esperado del issue padre cuando el despliegue termina exitosamente"
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  deploy:
    name: Construir y desplegar en ${{ inputs.environment }}
    runs-on: [self-hosted, "${{ inputs.runner_label }}", docurural-backend]
    environment: ${{ inputs.environment }}
    # Con workflow_dispatch sumado a los triggers de push, dos despliegues al mismo
    # ambiente pueden solaparse en el mismo host y corromper JAR_BACKUP_PATH (el
    # segundo respaldaría el JAR que el primero acaba de reemplazar). Se encolan en
    # vez de cancelarse para no interrumpir un despliegue a medio camino.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      SERVICE_NAME: docurural
      JAR_PATH: /opt/docurural/backend/docurural-api.jar
      JAR_BACKUP_PATH: /opt/docurural/backend/docurural-api.jar.bak
      LOG_PATH: /opt/docurural/logs/app.log
      APP_URL: http://localhost:8080/api

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Marcar inicio de despliegue en el tablero
        if: ${{ inputs.project_status_on_start != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          TO_STATUS: ${{ inputs.project_status_on_start }}
          FROM_STATUS: ${{ inputs.project_status_from_on_start }}
          DEPLOY_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/update_project_status.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Fijar versión de build
        if: ${{ success() && !endsWith(inputs.version, '-SNAPSHOT') }}
        run: mvn versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false --batch-mode --no-transfer-progress

      - name: Construir el JAR
        run: |
          mvn clean package --batch-mode --no-transfer-progress -DskipTests \
            -Dgit.commit=${{ github.sha }} \
            -Dgit.branch=${{ github.ref_name }}

      - name: Publicar JAR en GitHub Packages
        if: ${{ success() && inputs.publish_package }}
        run: mvn deploy --batch-mode --no-transfer-progress -DskipTests
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Respaldar el JAR actual
        run: |
          if [ -f "$JAR_PATH" ]; then
            cp "$JAR_PATH" "$JAR_BACKUP_PATH"
          else
            echo "No hay JAR previo — primer despliegue en este ambiente."
            rm -f "$JAR_BACKUP_PATH"
          fi

      - name: Detener el servicio antes de reemplazar el JAR
        run: sudo systemctl stop "$SERVICE_NAME"
        # El servicio puede no estar activo en el primer despliegue — ignorar error
        continue-on-error: true

      - name: Reemplazar el JAR en el servidor
        id: replace_jar
        run: cp "target/docurural-backend-${{ inputs.version }}.jar" "$JAR_PATH"

      - name: Arrancar el servicio
        id: start_service
        # SPRING_PROFILES_ACTIVE, CORS_ALLOWED_ORIGINS y el resto de la config sensible
        # los toma el proceso del EnvironmentFile del unit systemd en el host (fuera del
        # repo) — este job solo reemplaza el JAR, nunca la configuración del servicio.
        # inputs.spring_profile queda documentado para el paso de verificación.
        run: |
          sudo systemctl enable "$SERVICE_NAME"
          sudo systemctl start "$SERVICE_NAME"

      - name: Verificar salud del servicio y de la versión desplegada
        id: health_check
        run: |
          set -e
          ATTEMPTS=10
          for i in $(seq 1 $ATTEMPTS); do
            sleep 3
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/actuator/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check OK en el intento $i."
              break
            fi
            echo "Intento $i/$ATTEMPTS — health check retornó $STATUS, reintentando..."
            if [ "$i" = "$ATTEMPTS" ]; then
              echo "Health check nunca respondió 200."
              exit 1
            fi
          done

          DEPLOYED_VERSION=$(curl -s "$APP_URL/version" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
          echo "Versión reportada por /version: $DEPLOYED_VERSION (esperada: ${{ inputs.version }})"
          if [ "$DEPLOYED_VERSION" != "${{ inputs.version }}" ]; then
            echo "La versión desplegada no coincide con la esperada."
            exit 1
          fi

      - name: Marcar fin de despliegue en el tablero
        if: ${{ success() && inputs.project_status_on_success != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          TO_STATUS: ${{ inputs.project_status_on_success }}
          FROM_STATUS: ${{ inputs.project_status_from_on_success }}
          DEPLOY_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/update_project_status.py

      - name: Crear GitHub Release
        if: ${{ success() && inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ inputs.version }}
          files: target/docurural-backend-${{ inputs.version }}.jar
          generate_release_notes: true

      - name: Rollback automático ante fallo de verificación
        # Se limita a los pasos que pueden dejar el host en un estado roto (JAR
        # reemplazado pero el servicio no arrancó, o arrancó con una versión
        # que no pasa el health check). Un fallo anterior (build, publish) nunca
        # tocó el servicio en ejecución, así que no dispara un restart innecesario.
        if: >
          failure() &&
          (steps.replace_jar.outcome == 'failure' ||
           steps.start_service.outcome == 'failure' ||
           steps.health_check.outcome == 'failure')
        run: |
          echo "Revirtiendo al JAR anterior..."
          sudo systemctl stop "$SERVICE_NAME" || true
          if [ -f "$JAR_BACKUP_PATH" ]; then
            cp "$JAR_BACKUP_PATH" "$JAR_PATH"
            sudo systemctl start "$SERVICE_NAME"
            echo "Rollback completado — servicio reiniciado con el JAR anterior."
          else
            echo "No existe backup previo — no es posible hacer rollback automático."
          fi
          echo "----- Últimas 100 líneas de $LOG_PATH -----"
          tail -100 "$LOG_PATH" || true

      - name: Resumen del despliegue
        if: always()
        run: |
          echo "====================================================="
          echo "Despliegue ${{ inputs.environment }} — $(date)"
          echo "Versión: ${{ inputs.version }}"
          echo "Perfil:  ${{ inputs.spring_profile }} (configurado en el host, no por este job)"
          echo "Commit:  ${{ github.sha }}"
          echo "Rama:    ${{ github.ref_name }}"
          echo "Actor:   ${{ github.actor }}"
          echo "====================================================="
          sudo systemctl status "$SERVICE_NAME" --no-pager || true
