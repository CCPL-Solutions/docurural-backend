name: CD — Despliegue a Desarrollo

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a desplegar (vacío = la del pom.xml del ref seleccionado)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  read-version:
    name: Leer versión del pom
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pom-version.outputs.version }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Resolver versión a desplegar
        # En workflow_dispatch, inputs.version permite fijar exactamente qué versión
        # reponer (ej. tras recrear la infra con Terraform). Vacío = comportamiento
        # de siempre: la versión SNAPSHOT del pom.xml del ref seleccionado.
        id: pom-version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --batch-mode --no-transfer-progress)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  deploy:
    name: Desplegar en Desarrollo
    needs: read-version
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: development
      runner_label: develop
      version: ${{ needs.read-version.outputs.version }}
      spring_profile: develop
      publish_package: false
      # Un despliegue manual (workflow_dispatch) nunca mueve el tablero de GitHub
      # Projects — solo repone el componente, no representa avance de la release.
      project_status_on_success: ${{ github.event_name == 'push' && 'Ready for installation in certification' || '' }}
      project_status_from_on_success: ${{ github.event_name == 'push' && 'Development Completed' || '' }}
    secrets: inherit
